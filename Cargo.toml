[package]
name = "mathtutor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mt"
path = "src/main.rs"

[dependencies]
argh = "0.1.19"
ayml = "0.1.0"
chrono = { version = "0.4", features = ["serde"] }
fsrs = "5.2.0"
include_dir = "0.7"
libsql = { version = "0.9.30", default-features = false, features = ["core", "sync", "tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.18"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
