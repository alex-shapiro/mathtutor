[package]
name = "mathtutor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mt"
path = "src/main.rs"

[features]
default = ["mcp"]
# `mt mcp` server: SSE-over-HTTP transport, JSON-RPC tools and prompts.
mcp = [
    "dep:axum",
    "dep:rmcp",
    "dep:schemars",
    "dep:tokio-util",
    "dep:tower-http",
]

[dependencies]
argh = "0.1.19"
axum = { version = "0.8", optional = true }
ayml = "0.1.0"
chrono = { version = "0.4", features = ["serde"] }
fsrs = "5.2.0"
include_dir = "0.7"
libsql = { version = "0.9.30", default-features = false, features = ["core", "sync", "tls"] }
rmcp = { version = "1.7", optional = true, features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
schemars = { version = "1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.18"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", optional = true, features = ["rt"] }
tower-http = { version = "0.6", optional = true, features = ["trace"] }
tracing = "0.1.44"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3.27"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
