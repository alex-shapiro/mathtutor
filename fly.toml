# fly.toml app configuration file generated for mathtutor
# See https://fly.io/docs/reference/configuration
#
# App Secrets:
#
# MT_ADMIN_PASSWORD
# MT_API_KEY
# BASERUNNA_TOKEN
# BASERUNNA_DB (optional, default mathtutor)

app = 'mathtutor'
primary_region = 'ewr'

[build]

[env]
MT_PUBLIC_URL = 'https://mathtutor.fly.dev'
MT_CLIENT_IP_HEADER = 'Fly-Client-IP'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '10s'
method = 'GET'
path = '/health'

# Reports a database that the server cannot use, such as after a revoked key, an open
# import, or a schema change. A failed check stops `fly deploy` but does not stop routing.
[checks.database]
type = 'http'
port = 8080
method = 'GET'
path = '/ready'
interval = '60s'
timeout = '10s'
grace_period = '30s'

[[vm]]
cpu_kind = 'shared'
memory = '256mb'
cpus = 1
