# yaml-language-server: $schema=https://hub.ashell.dev/schemas/policy/v1.json

schema_version: 1
dependencies:
  ash/base-macos: ^0
  ash/claude-code: ^0
  ash/gemini-cli: ^0
  ash/github: ^0
  ash/rust-dev: ^0
files:
  rules:
  - path: ./**
  - path: ~/.mathtutor/**
  - path: ~/Applications/Claude Code URL Handler.app
    operations:
    - read
network:
  rules: []
exec:
  rules:
  - path: ~/.cargo/bin/mt
io_devices:
  rules:
  - class: AGXDeviceUserClient
  - class: IOSurfaceRootUserClient
